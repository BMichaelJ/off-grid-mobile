buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Pin onnxruntime-android to a specific version so that the
// "latest.integration" dynamic selector in the library's build.gradle
// does not need to fetch Maven metadata (works around SAX parser issues
// on some JVM versions).
allprojects {
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.microsoft.onnxruntime' &&
                    details.requested.version == 'latest.integration') {
                details.useVersion '1.24.2'
            }
        }
    }
}
